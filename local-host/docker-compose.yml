services:
  postgres:
    image: postgres:16.4-alpine
    container_name: mailhub-b4-postgres
    environment:
      POSTGRES_USER: mailhub
      POSTGRES_PASSWORD: mailhub
      POSTGRES_DB: mailhub
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailhub -d mailhub"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
