- capability_id: ca.valuation.aircraft_lite
  version: 1.1.0
  title: 整机 Lite 指示性估值
  description: 根据结构化整机状态数据生成可追溯的低值、中值和高值区间、价格桥、风险及 Pro 升级建议。
  when_to_use:
  - 对飞机整机进行 Lite 快速估值
  - 根据整机状态数据计算价格区间和证据缺口
  - 判断整机案例是否需要升级到航空器估值 Web 产品的 Pro 流程
  when_not_to_use:
  - 正式评估认证、融资或交易批准
  - 缺少机型、制造序号或制造年份且要求输出数字
  - 代替产权、法律、工程或市场专家签署
  handler:
    kind: http
    url: http://lite-valuation-toolhost:8790/v1/capabilities/ca.valuation.aircraft_lite
    timeout_seconds: 15
    bearer_token_env: CAPLATFORM_LITE_VALUATION_HANDLER_TOKEN
  input_schema:
    type: object
    additionalProperties: false
    required:
    - input
    - valuation_date
    properties:
      input:
        type: object
        minProperties: 1
      valuation_date:
        type: string
        format: date
  output_schema:
    type: object
    additionalProperties: false
    required:
    - artifact_ref
    - evidence_ref
    properties:
      artifact_ref:
        type: object
        additionalProperties: false
        required:
        - artifact_id
        - artifact_type
        - status
        - content
        properties:
          artifact_id:
            type: string
          artifact_type:
            const: aircraft_lite_indicative_valuation
          status:
            type: string
          content:
            type: object
      evidence_ref:
        type: object
        additionalProperties: false
        required:
        - evidence_id
        - kind
        - trace_id
        - invocation_id
        - skill_id
        - asset_type
        - valuation_date
        - input_digest
        - config_version
        - policy_status
        properties:
          evidence_id:
