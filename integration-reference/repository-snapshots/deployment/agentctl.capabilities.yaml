- capability_id: ca.report.generate_preview
  version: 1.0.0
  title: 生成民航专业报告草稿
  description: 根据结构化主题生成未发布、可编辑的报告草稿；不形成适航或安全最终结论。
  when_to_use:
  - 生成一份民航技术报告草稿
  - 根据主题创建可编辑报告
  when_not_to_use:
  - 适航批准或符合性最终签署
  - 维修放行、运行控制或安全风险接受
  handler: civil_aviation_workbench_agentctl_handlers:report_create
  input_schema:
    type: object
    additionalProperties: false
    required:
    - topic
    properties:
      topic:
        type: string
        minLength: 1
        maxLength: 500
  output_schema:
    type: object
    additionalProperties: false
    required:
    - artifact
    - evidence
    properties:
      artifact:
        type: object
      evidence:
        type: object
  result_object_types:
  - artifact_ref
  - evidence_ref
  side_effect_class: artifact
  risk_level: R1
  data_sensitivity: D1
  required_scopes:
  - ca.report.generate
  confirmation_policy: explicit
  compact_input_summary:
    required:
    - topic
  compact_output_summary:
    result_object_types:
    - artifact_ref
    - evidence_ref
  idempotency:
    required: true
    scope: tenant_actor_capability
  rollback:
    strategy: revoke_artifact_ref
    owner: caplatform-product-team
  smoke:
    query: 请生成一份 CCAR-145 质量审核周期分析报告草稿
    arguments:
      topic: CCAR-145 质量审核周期分析
  metadata:
    output_class: proposal
    authoritative_decision: false
    pilot_only: true
- capability_id: ca.project.create_task
  version: 1.0.0
  title: 在 AIProjectOPS 新建项目任务
  description: 经用户明确确认后，在指定 AIProjectOPS 项目中幂等创建一条可追溯任务。
  when_to_use:
  - 将已确认的工作项写入 AIProjectOPS 项目
  - 在指定项目中创建一条项目任务
  when_not_to_use:
  - 未明确指定目标项目
  - 用户尚未确认写入摘要
  - 修改、删除或直接执行已有任务
  handler:
    kind: python
    ref: civil_aviation_workbench_agentctl_handlers:project_task_create
    timeout_seconds: 20
  input_schema:
    type: object
    additionalProperties: false
    required:
    - project_id
    - title
    properties:
      project_id:
        type: string
        format: uuid
      title:
        type: string
        minLength: 1
        maxLength: 256
      description:
        type:
        - string
        - 'null'
        maxLength: 4000
      stage_id:
        type:
        - string
        - 'null'
        format: uuid
  output_schema:
    type: object
    additionalProperties: false
    required:
    - task_ref
    - evidence
    properties:
      task_ref:
        type: object
        additionalProperties: false
        required:
        - task_id
        - project_id
        - state
        - source_system
        - creation_ref
        properties:
          task_id:
            type: string
          project_id:
            type: string
          state:
            type: string
          source_system:
            const: aiprojectops
          creation_ref:
            type: string
      evidence:
        type: object
        additionalProperties: false
        required:
        - kind
        - trace_id
        - provider_status
        - idempotency_replayed
        properties:
          kind:
            const: aiprojectops_mcp
          trace_id:
            type: string
          provider_status:
            enum:
            - created
            - replayed
          idempotency_replayed:
            type: boolean
  result_object_types:
  - task_ref
  - evidence_ref
  side_effect_class: external
  risk_level: R2
  data_sensitivity: D1
  required_scopes:
  - ca.project.write
  confirmation_policy: explicit
  compact_input_summary:
    required:
    - project_id
    - title
  compact_output_summary:
    result_object_types:
    - task_ref
    - evidence_ref
  idempotency:
    required: true
    scope: tenant_actor_capability
    upstream: aiprojectops_mcp
  rollback:
    strategy: manual_task_state_compensation
    owner: aiprojectops-product-team
  smoke:
    query: 请在指定 AIProjectOPS 项目中创建一条联调任务
    arguments:
      project_id: 00000000-0000-0000-0000-000000000001
      title: CAPlatform 受治理写入联调
  metadata:
    output_class: governed_external_write
    authoritative_decision: false
    fact_owner: aiprojectops
    pilot_only: true
- capability_id: ca.project.external_event.propose
  version: 1.0.0
  title: 将外部事件转为项目审阅提案
  description: 将 CAPlatform 已验签和规范化的外部动作请求写入 AIProjectOPS 产品 intake；只形成待审阅提案，不直接修改项目权威事实。
  when_to_use:
  - 外部 Webhook 请求改变项目、触发专家或执行外部写入
  when_not_to_use:
  - 未经 CAPlatform 网关验签和规范化的原始 payload
  - 绕过人工确认直接修改项目任务、依赖、交付物或资产
  handler: civil_aviation_workbench_agentctl_handlers:project_external_event_propose
  input_schema:
    type: object
    additionalProperties: false
    required: [source_receipt_id, normalized_event]
    properties:
      source_receipt_id: {type: string, minLength: 1, maxLength: 160}
      normalized_event:
        type: object
        additionalProperties: true
        required: [schema_version, provider, event_type]
        properties:
          schema_version: {type: string, const: caplatform.external_event.v1}
          provider: {type: string, maxLength: 64}
          provider_event_id: {type: [string, 'null'], maxLength: 256}
          event_type: {type: string, maxLength: 160}
          project_match: {type: [string, 'null']}
          payload_summary: {type: object}
      handler_ref: {type: [string, 'null'], maxLength: 256}
  output_schema:
    type: object
    additionalProperties: false
    required: [intake_ref, evidence_ref]
    properties:
      intake_ref:
        type: object
        additionalProperties: true
        required: [intake_id, source_receipt_id, status, authoritative_write_performed]
      evidence_ref:
        type: object
        additionalProperties: true
        required: [evidence_id, kind, trace_id, capability_id]
  result_object_types: [intake_ref, evidence_ref]
  side_effect_class: none
  risk_level: R2
  data_sensitivity: D2
  required_scopes: [ca.project.write]
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability
    upstream: aiprojectops_external_event_intakes
  smoke:
    query: 将已验签的外部项目事件转成待审阅提案
    arguments:
      source_receipt_id: smoke-external-event-001
      normalized_event:
        schema_version: caplatform.external_event.v1
        provider: generic
        provider_event_id: smoke-001
        event_type: project.change_requested
        project_match: null
        payload_summary: {action: change_requested}
  metadata:
    output_class: proposal
    authoritative_decision: false
    direct_domain_write: false
    fact_owner: aiprojectops
- capability_id: ca.project.generate_plan
  version: 1.0.0
  title: 生成可审阅项目蓝图
  description: 基于 AIProjectOPS 项目简报和已解析来源提交异步规划任务，只生成草案，不写入正式项目。
  when_to_use:
  - 根据一句话启动项目规划
  - 根据已导入项目文件生成项目蓝图
  when_not_to_use:
  - 未创建 AIProjectOPS 规划会话
  - 直接批准或同步正式任务
  handler: civil_aviation_workbench_agentctl_handlers:project_plan_submit
  input_schema:
    type: object
    additionalProperties: false
    required:
    - session_id
    properties:
      session_id:
        type: string
        format: uuid
      base_draft_id:
        type:
        - string
        - 'null'
        format: uuid
      instruction:
        type:
        - string
        - 'null'
        maxLength: 4000
      planning_profile:
        type:
        - string
        - 'null'
        enum:
        - balanced
        - concise
        - detailed
        - null
      capability_catalog:
        type: object
        additionalProperties: false
        required: [schema_version, catalog_version, query, no_match, capabilities]
        properties:
          schema_version: {type: string, const: aiprojectops.capability_catalog_context.v1}
          catalog_version: {type: string, maxLength: 256}
          scoring_version: {type: string, maxLength: 256}
          query: {type: string, maxLength: 8000}
          no_match: {type: boolean}
          capabilities:
            type: array
            maxItems: 20
            items:
              type: object
              additionalProperties: true
              required: [capability_id, title, side_effect_class, risk_level]
  output_schema:
    type: object
    additionalProperties: true
    required:
    - job_ref
    - evidence_ref
    properties:
      job_ref: {type: object}
      evidence_ref: {type: object}
      artifact_ref: {type: object}
      error: {type: object}
  result_object_types:
  - job_ref
  - artifact_ref
  - evidence_ref
  side_effect_class: artifact
  risk_level: R2
  data_sensitivity: D2
  required_scopes:
  - ca.project.write
  confirmation_policy: explicit
  async_mode: job
  job_lifecycle:
    role: submit
    status_capability_id: ca.project.generate_plan.status
    cancel_capability_id: ca.project.generate_plan.cancel
  compact_input_summary:
    required:
    - session_id
  compact_output_summary:
    result_object_types:
    - job_ref
    - artifact_ref
    - evidence_ref
  idempotency:
    required: true
    scope: tenant_actor_capability
    upstream: aiprojectops_planning_jobs
  smoke:
    query: 为已有项目规划会话生成一份可审阅项目蓝图
    arguments:
      session_id: 00000000-0000-0000-0000-000000000001
      planning_profile: balanced
  metadata:
    output_class: proposal
    authoritative_decision: false
    fact_owner: aiprojectops
    worker_model_route: agentctl.model_gateway
