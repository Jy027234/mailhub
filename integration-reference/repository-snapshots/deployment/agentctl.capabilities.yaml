- capability_id: ca.collaboration.document.search
  version: 1.0.0
  title: 搜索已授权协作文档
  description: 通过已复核发布的绑定搜索当前租户可访问的协作文档，并返回稳定引用。
  when_to_use:
  - 用户要在已连接的钉钉或飞书文档中搜索标题或内容
  when_not_to_use:
  - 用户要求读取未授权空间、修改文档或直接发布内容
  handler: mcp_integration_agentctl_handlers:collaboration_document_search
  input_schema:
    type: object
    additionalProperties: false
    required: [published_binding_id, arguments]
    properties:
      published_binding_id: {type: string, minLength: 1, maxLength: 200}
      arguments:
        type: object
        additionalProperties: false
        required: [query]
        properties:
          query: {type: string, minLength: 1, maxLength: 500}
          cursor: {type: [string, 'null'], maxLength: 1000}
          limit: {type: integer, minimum: 1, maximum: 100}
  output_schema:
    type: object
    additionalProperties: false
    required: [invocation, result, evidence]
    properties:
      invocation: {type: object}
      result:
        type: object
        additionalProperties: false
        required: [items, next_cursor]
        properties:
          items:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required: [provider, object_ref, title]
              properties:
                provider: {type: string, minLength: 1}
                object_ref: {type: string, minLength: 1}
                title: {type: string, minLength: 1, maxLength: 500}
                url: {type: [string, 'null'], format: uri}
                updated_at: {type: [string, 'null'], format: date-time}
          next_cursor: {type: [string, 'null']}
      evidence: {type: object}
  result_object_types: [evidence_ref]
  side_effect_class: none
  risk_level: R1
  data_sensitivity: D1
  required_scopes: [collaboration.document.search]
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability
  metadata:
    operation_key: collaboration.document.search
    mcp_binding_required: true
    pilot_only: true
- capability_id: ca.collaboration.task.list
  version: 1.0.0
  title: 列出已授权协作待办
  description: 通过已复核发布的绑定列出当前主体可访问的协作待办，不执行任何写操作。
  when_to_use:
  - 用户要查看本人或当前授权范围内的协作待办
  when_not_to_use:
  - 用户要求创建、完成、转派或删除待办
  handler: mcp_integration_agentctl_handlers:collaboration_task_list
  input_schema:
    type: object
    additionalProperties: false
    required: [published_binding_id, arguments]
    properties:
      published_binding_id: {type: string, minLength: 1, maxLength: 200}
      arguments:
        type: object
        additionalProperties: false
        properties:
          status: {type: string, enum: [open, completed, all]}
          cursor: {type: [string, 'null'], maxLength: 1000}
          limit: {type: integer, minimum: 1, maximum: 100}
  output_schema:
    type: object
    additionalProperties: false
    required: [invocation, result, evidence]
    properties:
      invocation: {type: object}
      result:
        type: object
        additionalProperties: false
        required: [items, next_cursor]
        properties:
          items:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required: [task_ref, title, status]
              properties:
                task_ref: {type: string, minLength: 1}
                title: {type: string, minLength: 1, maxLength: 500}
                status: {type: string, enum: [open, completed]}
                due_at: {type: [string, 'null'], format: date-time}
          next_cursor: {type: [string, 'null']}
      evidence: {type: object}
  result_object_types: [evidence_ref]
  side_effect_class: none
  risk_level: R0
  data_sensitivity: D1
  required_scopes: [collaboration.task.list]
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability
  metadata:
    operation_key: collaboration.task.list
    mcp_binding_required: true
    pilot_only: true
- capability_id: ca.collaboration.task.create
  version: 1.0.0
  title: 创建已审批的协作待办
  description: 通过已复核发布的 R2 绑定创建一条待办；不发送消息、不发布文档、不扩大共享权限。
  when_to_use:
  - 用户明确要求在已连接 Provider 中创建待办，且目标、负责人、关键字段已展示并获批
  when_not_to_use:
  - 用户要求自动发送消息、批量创建、发布文档、改变权限或绕过审批
  handler: mcp_integration_agentctl_handlers:collaboration_task_create
  input_schema:
    type: object
    additionalProperties: false
    required: [published_binding_id, arguments]
    properties:
      published_binding_id: {type: string, minLength: 1, maxLength: 200}
      arguments:
        type: object
        additionalProperties: false
        required: [title, assignee_ref]
        properties:
          title: {type: string, minLength: 1, maxLength: 500}
          description: {type: [string, 'null'], maxLength: 10000}
          assignee_ref: {type: string, minLength: 1, maxLength: 500}
          due_at: {type: [string, 'null'], format: date-time}
  output_schema:
    type: object
    additionalProperties: false
    required: [invocation, result, evidence]
    properties:
      invocation: {type: object}
      result:
        type: object
        additionalProperties: false
        required: [task_ref, receipt_ref]
        properties:
          task_ref: {type: string, minLength: 1}
          receipt_ref: {type: string, minLength: 1}
      evidence: {type: object}
  result_object_types: [task_ref, evidence_ref]
  side_effect_class: external
  risk_level: R2
  data_sensitivity: D1
  required_scopes: [collaboration.task.create]
  confirmation_policy: explicit
  idempotency:
    required: true
    scope: tenant_actor_capability
  metadata:
    operation_key: collaboration.task.create
    mcp_binding_required: true
    write_feature_flag: MCP_COLLABORATION_WRITE_ENABLED
    pilot_only: true
