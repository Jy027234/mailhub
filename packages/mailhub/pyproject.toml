[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mailhub"
version = "0.1.0"
description = "Provider-neutral, policy-governed intelligent mail management core."
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
mailhub-api = "mailhub.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pyyaml>=6.0,<7",
  "ruff>=0.9",
  # Only needed to run scripts/smtp_wire_conformance.py, which drives the real
  # connector against a local implicit-TLS capture server.  The harness imports
  # it lazily so the rest of the suite works without it.
  "aiosmtpd>=1.4,<2",
]
postgres = [
  "asyncpg>=0.30,<1",
]
observability = [
  "opentelemetry-api>=1.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailhub"]

[tool.hatch.build.targets.sdist]
# A release sdist must carry sources only.  Node dependencies and build outputs
# are reproduced from package.json/package-lock.json by the consumer.
exclude = [
  "**/node_modules",
  "**/node_modules/**",
  "**/dist",
  "**/dist/**",
  "**/__pycache__",
  "**/*.pyc",
  "**/*.tsbuildinfo",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
