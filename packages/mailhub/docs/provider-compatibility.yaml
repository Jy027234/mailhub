schema_version: mailhub.provider_compatibility.v1
reviewed_at: 2026-08-19
policy:
  real_provider_evidence_required_for_advertisement: true
  sandbox_is_not_production_evidence: true
  domestic_release_path:
    decision: 国内部署以 IMAP/SMTP + 应用授权码为主路径；Gmail 标记为出范围，Microsoft Graph 标记为可选低优先级。
    primary: imap_smtp
    out_of_scope_domestic: [gmail]
    optional_low_priority: [microsoft_graph]
    rationale: Gmail 在国内基本不可达；Graph 仅在世纪互联 O365 客户明确需要时启用。出范围/可选不是删除 connector 代码，而是从国内发布阻断门中摘除。
providers:
  sandbox:
    release_scope: test_only
    status: contract_only
    connector: mailhub.connectors.sandbox.SandboxConnector
    capabilities: [incremental_sync, backfill, deterministic_replay]
    evidence: tests/test_connectors.py
  gmail:
    release_scope: out_of_scope_domestic
    status: preflight_m2
    connector: mailhub.connectors.http_providers.GmailConnector
    capabilities: [history_cursor, bounded_backfill, metadata_projection]
    evidence: [tests/test_connectors.py, tests/test_notifications.py, tests/test_host_adapters.py, tests/test_subscriptions.py, tests/test_provider_activation.py, migrations/0013_mailhub_subscription_state.sql, migrations/0014_mailhub_provider_metadata.sql, migrations/0015_mailhub_webhook_route_metadata.sql, migrations/0016_mailhub_connection_identity.sql, migrations/0017_mailhub_sync_filters.sql, migrations/0018_mailhub_sync_deleted_count.sql, migrations/0019_mailhub_sync_cancelling.sql, migrations/0020_mailhub_message_recipient_headers.sql, migrations/0021_mailhub_sync_retry.sql]
    activation_runner: scripts/run_provider_activation.py
    activation_runbook: docs/mailhub-provider-activation-runbook.md
    notification_parser: mailhub.notifications.parse_gmail_pubsub_notification
    subscription_port: mailhub.ports.ProviderSubscriptionPort
    required_scopes: [https://www.googleapis.com/auth/gmail.readonly]
    official_references:
      - https://developers.google.com/workspace/gmail/api/guides/sync
      - https://developers.google.com/workspace/gmail/api/guides/push
      - https://developers.google.com/workspace/gmail/api/auth/scopes
    restrictions:
      - real_oauth_and_mailbox_acceptance_required
      - watch_pubsub_and_reconciliation_not_claimed
      - provider_search_contract_not_enabled
      - read_only_send_gate_default_true
  microsoft_graph:
    release_scope: optional_low_priority
    status: preflight_m3
    connector: mailhub.connectors.http_providers.MicrosoftGraphConnector
    capabilities: [delta_cursor, bounded_backfill, metadata_projection]
    evidence: [tests/test_connectors.py, tests/test_notifications.py, tests/test_host_adapters.py, tests/test_subscriptions.py, tests/test_provider_activation.py, migrations/0013_mailhub_subscription_state.sql, migrations/0014_mailhub_provider_metadata.sql, migrations/0015_mailhub_webhook_route_metadata.sql, migrations/0016_mailhub_connection_identity.sql, migrations/0017_mailhub_sync_filters.sql, migrations/0018_mailhub_sync_deleted_count.sql, migrations/0019_mailhub_sync_cancelling.sql, migrations/0020_mailhub_message_recipient_headers.sql, migrations/0021_mailhub_sync_retry.sql]
    activation_runner: scripts/run_provider_activation.py
    activation_runbook: docs/mailhub-provider-activation-runbook.md
    notification_parser: mailhub.notifications.parse_graph_change_notifications
    subscription_port: mailhub.ports.ProviderSubscriptionPort
    required_scopes: [Mail.Read, offline_access]
    official_references:
      - https://learn.microsoft.com/en-us/graph/auth-v2-user
      - https://learn.microsoft.com/en-us/graph/delta-query-messages
      - https://learn.microsoft.com/en-us/graph/outlook-change-notifications-overview
    restrictions:
      - real_oauth_and_mailbox_acceptance_required
      - change_notifications_and_reconciliation_not_claimed
      - free_form_labels_rejected; use category:Name for bounded Graph categories
      - provider_search_contract_not_enabled
      - read_only_send_gate_default_true
  imap_smtp:
    release_scope: primary
    status: real_mailbox_partial
    connector: mailhub.connectors.imap_smtp.ImapSmtpConnector
    capabilities: [tls, application_password_auth, uidvalidity_cursor, optional_modseq_cursor, smtp_outbox]
    evidence: [tests/test_connectors.py, local-host/scripts/b4_imap.py, local-host/scripts/b4_send.py, scripts/imap_server_matrix_probe.py, ../../docs/reports/mailhub-imap-server-matrix-2026-08-19.md]
    domestic_evidence: 网易企业邮箱 imap.qiye.163.com:993 真实只读切片（backfill 50 / 增量 0 重复 / 45 线程 / 50 分析 / 1 知识候选）+ smtp.qiye.163.com:465 受控发送闭环；属本地单用户证据，不替代服务器矩阵 / SMTP 对账。
    server_matrix:
      verified: [163_qiye_enterprise, qq_mail, dovecot_2_4_local]
      still_open: [self_hosted_exchange]
      probe: scripts/imap_server_matrix_probe.py
      local_fixture: scripts/local_dovecot_fixture.py
      evidence: ../../docs/reports/mailhub-imap-server-matrix-2026-08-19.md
      capability_divergence:
        note: 能力必须按服务器协商，任何写死都会在真实服务器上说谎
        idle: {163_qiye_enterprise: false, qq_mail: true, dovecot_2_4_local: true}
        condstore: {163_qiye_enterprise: false, qq_mail: false, dovecot_2_4_local: false}
        enable: {163_qiye_enterprise: false, qq_mail: false, dovecot_2_4_local: true}
        uidplus: {163_qiye_enterprise: false, qq_mail: true, dovecot_2_4_local: false}
        move: {163_qiye_enterprise: false, qq_mail: true, dovecot_2_4_local: false}
        namespace: {163_qiye_enterprise: false, qq_mail: true, dovecot_2_4_local: false}
        quota: {163_qiye_enterprise: false, qq_mail: false, dovecot_2_4_local: false}
        auth_xoauth2: {163_qiye_enterprise: false, qq_mail: true, dovecot_2_4_local: false}
        hierarchy_delimiter: {163_qiye_enterprise: "/", qq_mail: "/", dovecot_2_4_local: "."}
      capability_token_findings:
        - dovecot_implements_uidplus_without_advertising_the_token
        - dovecot_exposes_condstore_through_ENABLE_which_a_literal_token_check_misses
        - hierarchy_delimiter_differs_per_server_never_assume_slash
    smtp_wire_evidence:
      harness: scripts/smtp_wire_conformance.py
      evidence: ../../docs/reports/mailhub-smtp-wire-conformance-2026-08-19.json
      verified:
        - envelope_sender_is_authenticated_account
        - envelope_recipients_equal_to_cc_bcc
        - bcc_never_transmitted
        - message_id_matches_receipt
        - reply_headers_present
        - audience_injection_cannot_reach_envelope
        - send_disabled_refused
        - missing_credential_refused
      provider_roundtrip:
        harness: scripts/smtp_provider_roundtrip.py
        evidence: ../../docs/reports/mailhub-smtp-provider-roundtrip-163-2026-08-19.json
        provider: 163_qiye_enterprise
        verified:
          - received_message_id_matches_receipt
          - subject_marker_survived
          - body_marker_survived
          - recipient_set_survived
          - sender_address_matches_account
          - no_duplicate_on_single_pass
          - second_pass_sees_it_once
        cleanup_note: the self-addressed test message stays in the mailbox; its subject carries the [mailhub-roundtrip <marker>] prefix
      size_bound:
        enforced_before_connect: true
        default_bytes: 10485760
        configurable_via: MAILHUB_SMTP_MAX_SEND_BYTES
        refusal_error: smtp_message_too_large
        non_retryable: true
      observed_163_qiye_enterprise:
        tls: TLSv1.3
        auth: [AUTH=PLAIN]
        uidvalidity: 1
        uidnext_invariant_holds: true
        exists_matches_uid_search: true
        idle: false
        condstore: false
        uidplus: false
        move: false
        namespace: false
        quota: false
        status_field_order_guaranteed: false
        poll_is_the_only_supported_path: true
    restrictions:
      - poll_is_the_only_path_on_163_idle_absent
      - modseq_cursor_unavailable_on_both_verified_servers
      - smtp_002_reconciliation_and_four_eyes_production_semantics_still_open
      - uidplus_absent_no_uid_expunge_on_163
      - self_hosted_exchange_row_still_open
      - smtp_send_disabled_by_default
